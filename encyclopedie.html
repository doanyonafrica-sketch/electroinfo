  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>

  <style>
    :root{
      --bg:#0d0f14; --surface:#141820; --surface2:#1c2230;
      --border:#252d3d; --accent:#3b82f6; --accent2:#f59e0b;
      --text:#e2e8f0; --muted:#8892a4; --tag-bg:#1e2a40;
      --r:10px; --fh:'Syne',sans-serif; --fb:'DM Sans',sans-serif; --fm:'DM Mono',monospace;
    }
    [data-theme=light]{--bg:#f4f6fb;--surface:#fff;--surface2:#eef1f7;--border:#d4d9e8;--text:#0d0f14;--muted:#6b7690;--tag-bg:#dce6f7;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--fb);background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}
    a{color:var(--accent);text-decoration:none;}
    a:hover{text-decoration:underline;}
    button{cursor:pointer;border:none;background:none;font-family:inherit;}

    /* ─── NAVBAR ELECTROINFO ─── */
    .navbar{display:flex;align-items:center;width:100%;height:68px;padding:0 max(1.5rem,env(safe-area-inset-left));padding-right:max(1.5rem,env(safe-area-inset-right));position:sticky;top:0;z-index:1000;background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 100%);box-shadow:0 2px 16px rgba(0,0,0,.18);box-sizing:border-box;}
    .navbar .container{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1280px;margin:0 auto;gap:.5rem;}
    .nav-brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;flex-shrink:0;}
    .nav-brand img{height:36px;width:auto;flex-shrink:0;}
    .nav-brand span{font-size:1.2rem;font-weight:800;color:white;letter-spacing:-.02em;white-space:nowrap;}
    .nav-menu{display:flex;align-items:center;justify-content:space-between;flex:1;gap:.25rem;}
    .nav-links{display:flex;align-items:center;gap:.125rem;}
    .nav-link{display:flex;align-items:center;gap:.4rem;padding:.5rem .875rem;color:rgba(255,255,255,.82);text-decoration:none;font-size:.9rem;font-weight:600;border-radius:.5rem;transition:all .2s ease;white-space:nowrap;}
    .nav-link:hover,.nav-link.active{color:white;background:rgba(255,255,255,.15);}
    .nav-actions{display:flex;align-items:center;gap:.5rem;flex-shrink:0;}
    #loginBtn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1.1rem;background:white;color:#1e40af;border:none;border-radius:9999px;font-size:.875rem;font-weight:700;text-decoration:none;cursor:pointer;transition:all .2s ease;white-space:nowrap;line-height:1;}
    #loginBtn:hover{background:#f0f4ff;transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.18);}
    #userMenu{position:relative;display:flex;align-items:center;}
    #userMenuToggle{display:flex;align-items:center;gap:.5rem;padding:.35rem .75rem .35rem .35rem;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);border-radius:9999px;color:white;cursor:pointer;transition:all .2s ease;font-size:.875rem;font-weight:600;white-space:nowrap;}
    #userMenuToggle:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5);}
    #userAvatar{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.2);}
    #userName{font-size:.875rem;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    #userDropdown{position:absolute;top:calc(100% + 10px);right:0;min-width:230px;background:white;border-radius:1rem;box-shadow:0 12px 40px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.06);overflow:hidden;z-index:1100;animation:dropdownIn .2s ease;}
    @keyframes dropdownIn{from{opacity:0;transform:translateY(-8px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
    .dropdown-header{display:flex;align-items:center;gap:.85rem;padding:1.1rem 1.1rem .9rem;background:#f8fafc;border-bottom:1px solid #e2e8f0;}
    .dropdown-header img{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid #e2e8f0;}
    .dropdown-header strong{display:block;font-size:.9rem;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
    .dropdown-header p{margin:0;font-size:.78rem;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
    .dropdown-divider{border-top:1px solid #e2e8f0;margin:.25rem 0;}
    .dropdown-item{display:flex;align-items:center;gap:.65rem;width:100%;padding:.7rem 1.1rem;font-size:.875rem;font-weight:500;color:#374151;text-decoration:none;background:none;border:none;cursor:pointer;transition:background .15s ease;text-align:left;}
    .dropdown-item:hover{background:#f1f5f9;color:#1e40af;}
    .dropdown-item i{width:16px;text-align:center;color:#6b7280;font-size:.875rem;}
    .mobile-toggle{display:none;align-items:center;justify-content:center;width:40px;height:40px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);border-radius:.5rem;color:white;cursor:pointer;transition:all .2s ease;flex-shrink:0;padding:0;}
    .mobile-toggle:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5);}
    .mobile-toggle i{font-size:1.1rem;}
    .lang-switcher{position:relative;display:inline-flex;align-items:center;flex-shrink:0;}
    .lang-current-btn{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);color:white;padding:.4rem .85rem;border-radius:2rem;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;}
    .lang-current-btn:hover{background:rgba(255,255,255,.3);}
    .lang-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:white;border-radius:.75rem;box-shadow:0 8px 28px rgba(0,0,0,.18);overflow:hidden;z-index:99999;min-width:160px;}
    .lang-dropdown.open{display:block;animation:langIn .15s ease;}
    @keyframes langIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
    .lang-option{display:flex;align-items:center;gap:.5rem;width:100%;padding:.7rem 1.1rem;text-align:left;background:none;border:none;font-size:.9rem;font-weight:500;color:#374151;cursor:pointer;transition:background .15s;}
    .lang-option:hover{background:#f3f4f6;}
    .lang-option.lang-active{background:#eff6ff;color:#1e40af;font-weight:700;}
    .hidden{display:none!important;}
    /* Mobile navbar */
    @media(max-width:768px){
      .navbar{height:60px;padding:0 max(1rem,env(safe-area-inset-left));padding-right:max(1rem,env(safe-area-inset-right));}
      .navbar .container{height:60px;gap:.5rem;}
      .nav-brand span{max-width:120px;overflow:hidden;text-overflow:ellipsis;font-size:1.05rem;}
      .mobile-toggle{display:flex;order:99;}
      #loginBtn .btn-text{display:none;}
      #loginBtn{padding:.5rem .75rem;border-radius:50%;width:38px;height:38px;justify-content:center;}
      .lang-current-btn{padding:.35rem .6rem;font-size:.75rem;}
      .nav-menu{display:none;position:fixed;top:60px;left:0;right:0;bottom:0;background:linear-gradient(170deg,#1e3a8a 0%,#1e40af 60%,#1d4ed8 100%);flex-direction:column;align-items:stretch;padding:1.25rem 1rem;gap:0;z-index:999;overflow-y:auto;border-top:1px solid rgba(255,255,255,.12);}
      .nav-menu.active{display:flex;animation:slideDown .28s cubic-bezier(.4,0,.2,1);}
      @keyframes slideDown{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}
      .nav-links{display:flex;flex-direction:column;gap:.125rem;width:100%;margin-bottom:1rem;}
      .nav-link{padding:.875rem 1.1rem;font-size:1rem;border-radius:.625rem;width:100%;color:rgba(255,255,255,.88);border-bottom:1px solid rgba(255,255,255,.06);}
      .nav-link:last-child{border-bottom:none;}
      .nav-link:hover,.nav-link.active{background:rgba(255,255,255,.14);color:white;padding-left:1.4rem;}
      .nav-actions{display:flex;flex-direction:column;align-items:stretch;gap:.625rem;width:100%;padding-top:.5rem;}
      #loginBtn{width:100%;justify-content:center;padding:.875rem 1rem;border-radius:.75rem;font-size:1rem;}
      #loginBtn .btn-text{display:inline;}
      #userMenu{width:100%;}
      #userMenuToggle{width:100%;justify-content:space-between;padding:.75rem 1rem;border-radius:.75rem;}
      #userName{display:block;max-width:none;flex:1;}
      #userDropdown{position:static;animation:none;border-radius:.75rem;box-shadow:0 4px 16px rgba(0,0,0,.25);margin-top:.4rem;}
    }
    @media(max-width:480px){
      .nav-brand span{max-width:90px;font-size:.95rem;}
      .lang-dropdown{right:auto;left:0;min-width:145px;}
    }

    /* ─── LAYOUT ─── */
    .wrap{display:flex;max-width:1300px;margin:0 auto;padding:32px 20px 80px;gap:28px;align-items:flex-start;}

    /* ─── SIDEBAR ─── */
    .sleft{width:252px;flex-shrink:0;position:sticky;top:70px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;max-height:calc(100vh - 86px);display:flex;flex-direction:column;}
    .sl-head{padding:12px 16px;border-bottom:1px solid var(--border);font-family:var(--fh);font-weight:700;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .sl-count{font-size:.72rem;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none;}
    .sl-search{margin:8px 10px;display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 11px;flex-shrink:0;}
    .sl-search input{flex:1;background:none;border:none;outline:none;font-family:var(--fb);font-size:.81rem;color:var(--text);}
    .sl-search input::placeholder{color:var(--muted);}
    .sl-scroll{overflow-y:auto;flex:1;}
    .sl-letter{padding:6px 16px 2px;font-family:var(--fh);font-weight:700;font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
    .se{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:.81rem;color:var(--muted);cursor:pointer;transition:background .15s,color .15s;border-left:3px solid transparent;}
    .se:hover{background:var(--surface2);color:var(--text);}
    .se.active{background:var(--tag-bg);color:var(--accent);border-left-color:var(--accent);}
    .se-icon{font-size:.95rem;flex-shrink:0;}
    .cbadge{margin-left:auto;font-size:.6rem;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:4px;text-transform:uppercase;flex-shrink:0;}
    .cbadge.composant{background:#1e3a5f;color:#60a5fa;}
    .cbadge.electricite{background:#3d2a00;color:#f59e0b;}

    /* ─── MAIN ─── */
    .main{flex:1;min-width:0;}

    /* ─── ÉTAT CHARGEMENT / ERREUR ─── */
    .state-box{text-align:center;padding:60px 20px;color:var(--muted);}
    .state-box .icon{font-size:2.5rem;margin-bottom:14px;}
    .state-box p{font-size:.9rem;line-height:1.6;max-width:400px;margin:0 auto 20px;}
    .state-box .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:opacity .2s;}
    .state-box .btn:hover{opacity:.85;}
    .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ─── FILTRES ─── */
    .lfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
    .fb{padding:7px 16px;border-radius:20px;font-size:.82rem;font-weight:600;border:1.5px solid var(--border);color:var(--muted);background:var(--surface);transition:all .2s;}
    .fb:hover{border-color:var(--accent);color:var(--accent);}
    .fb.on{background:var(--accent);border-color:var(--accent);color:#fff;}

    /* ─── GRID CARTES ─── */
    .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;}
    .lc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;position:relative;overflow:hidden;animation:fu .35s both;}
    .lc::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s;}
    .lc:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,.22);}
    .lc:hover::after{transform:scaleX(1);}
    .lc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .lc-icon{font-size:1.3rem;}
    .lctag{font-size:.67rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:4px;}
    .lctag.composant{background:#1e3a5f;color:#60a5fa;}
    .lctag.electricite{background:#3d2a00;color:#f59e0b;}
    .lc h3{font-family:var(--fh);font-weight:700;font-size:.92rem;letter-spacing:-.01em;margin-bottom:6px;}
    .lc p{font-size:.8rem;color:var(--muted);line-height:1.55;}
    .lc-foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .lc-meta{font-size:.72rem;color:var(--muted);}
    .lc-arr{width:26px;height:26px;border-radius:6px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.75rem;transition:background .2s,color .2s;}
    .lc:hover .lc-arr{background:var(--accent);color:#fff;}

    /* ─── ARTICLE ─── */
    .artview{display:none;}
    .artview.show{display:block;}
    .listview.hide{display:none;}
    .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:.81rem;color:var(--muted);margin-bottom:20px;padding:6px 12px;border-radius:6px;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:background .2s,color .2s;}
    .back-btn:hover{background:var(--surface2);color:var(--text);}
    .art-share{padding:6px 12px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);font-size:.78rem;color:var(--muted);transition:all .2s;display:inline-flex;align-items:center;gap:5px;}
    .art-share:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
    .artlayout{display:flex;gap:26px;align-items:flex-start;}
    .artbody{flex:1;min-width:0;}

    /* Titre article */
    .art-icon-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;}
    .art-bigicon{width:52px;height:52px;border-radius:12px;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex-shrink:0;}
    .art-h1{font-family:var(--fh);font-weight:800;font-size:clamp(1.4rem,3vw,1.95rem);letter-spacing:-.03em;line-height:1.15;}
    .art-sub{color:var(--muted);font-size:.86rem;margin-top:5px;font-style:italic;}
    .art-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
    .atag{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:4px;}
    .atag.composant{background:#1e3a5f;color:#60a5fa;}
    .atag.electricite{background:#3d2a00;color:#f59e0b;}
    .atag.plain{background:var(--tag-bg);color:var(--muted);}
    .art-divider{height:1px;background:var(--border);margin:18px 0;}

    /* Intro */
    .art-intro{border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 8px 8px 0;padding:14px 18px;margin-bottom:24px;font-size:.91rem;line-height:1.75;color:var(--text);}

    /* TOC */
    .toc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;margin-bottom:28px;display:inline-block;min-width:240px;max-width:100%;}
    .toc-title{font-family:var(--fh);font-weight:700;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
    .toc-tog{font-size:.7rem;color:var(--muted);cursor:pointer;margin-left:auto;}
    .toc-tog:hover{color:var(--text);}
    .toclist{list-style:none;}
    .toclist li{padding:2px 0;}
    .toclist a{font-size:.81rem;color:var(--muted);display:flex;align-items:center;gap:6px;transition:color .15s;}
    .toclist a:hover{color:var(--accent);text-decoration:none;}
    .tocnum{font-family:var(--fm);font-size:.73rem;color:var(--accent);min-width:22px;}
    .toc-sub{padding-left:20px !important;}
    .toc-sub a{font-size:.77rem;}

    /* Sections */
    .art-section{margin-bottom:30px;}
    .art-h2{font-family:var(--fh);font-weight:700;font-size:1.06rem;letter-spacing:-.01em;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:10px;scroll-margin-top:76px;}
    .secnum{font-family:var(--fm);font-size:.73rem;color:var(--accent);}
    .art-h3{font-family:var(--fh);font-weight:700;font-size:.91rem;margin:16px 0 9px;padding-left:10px;border-left:3px solid var(--border);scroll-margin-top:76px;}
    .art-p{font-size:.875rem;line-height:1.8;color:var(--muted);margin-bottom:9px;}
    .art-p strong{color:var(--text);}
    .wl{color:var(--accent);border-bottom:1px dotted var(--accent);cursor:pointer;transition:color .15s;}
    .wl:hover{color:#93c5fd;}
    .formula{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 20px;font-family:var(--fm);font-size:.92rem;text-align:center;color:var(--accent2);margin:12px 0;letter-spacing:.03em;}

    /* Références */
    .rn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--tag-bg);border:1px solid var(--accent);font-size:.61rem;font-weight:700;color:var(--accent);cursor:pointer;margin-left:1px;vertical-align:super;transition:background .15s;}
    .rn:hover{background:var(--accent);color:#fff;}
    .refs-sec{margin-top:34px;padding-top:18px;border-top:2px solid var(--border);}
    .refs-title{font-family:var(--fh);font-weight:700;font-size:.88rem;margin-bottom:10px;color:var(--muted);}
    .refs-ol{list-style:none;counter-reset:rc;}
    .refs-ol li{counter-increment:rc;font-size:.77rem;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;}
    .refs-ol li:last-child{border-bottom:none;}
    .refs-ol li::before{content:counter(rc);min-width:20px;height:20px;border-radius:50%;background:var(--tag-bg);color:var(--accent);font-size:.67rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}

    /* Tooltip footnote */
    .fntip{position:fixed;z-index:400;background:var(--surface);border:1.5px solid var(--accent);border-radius:8px;padding:10px 14px;max-width:290px;font-size:.79rem;color:var(--text);line-height:1.55;box-shadow:0 8px 28px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .2s;}
    .fntip.show{opacity:1;}

    /* ─── INFOBOX ─── */
    .infobox{width:230px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;position:sticky;top:70px;}
    .ib-head{padding:11px 14px;background:var(--tag-bg);border-bottom:1px solid var(--border);font-family:var(--fh);font-weight:700;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);text-align:center;}
    .ib-icon{text-align:center;padding:16px 0;font-size:2.6rem;border-bottom:1px solid var(--border);}
    .ib-row{padding:9px 14px;border-bottom:1px solid var(--border);}
    .ib-row:last-child{border-bottom:none;}
    .ib-k{font-size:.68rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px;}
    .ib-v{font-size:.82rem;color:var(--text);font-weight:500;}
    .ib-v.mono{font-family:var(--fm);font-size:.78rem;color:var(--accent2);}
    .rel-box{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
    .rel-head{padding:9px 13px;background:var(--surface2);border-bottom:1px solid var(--border);font-family:var(--fh);font-weight:700;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
    .rel-link{display:flex;align-items:center;gap:8px;padding:8px 13px;font-size:.81rem;color:var(--muted);cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s,color .15s;}
    .rel-link:last-child{border-bottom:none;}
    .rel-link:hover{background:var(--surface2);color:var(--text);}

    /* ─── TOAST ─── */
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-size:.83rem;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:500;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* ─── RECHERCHE INTELLIGENTE ─── */
    .search-bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;}
    .search-input-wrap{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 15px;transition:border-color .2s,box-shadow .2s;}
    .search-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
    .search-input-wrap svg{flex-shrink:0;color:var(--muted);}
    .search-input-wrap input{flex:1;background:none;border:none;outline:none;font-family:var(--fb);font-size:.92rem;color:var(--text);}
    .search-input-wrap input::placeholder{color:var(--muted);}
    .btn-search{padding:10px 20px;background:var(--accent);color:#fff;border-radius:8px;font-size:.86rem;font-weight:700;transition:opacity .2s;white-space:nowrap;flex-shrink:0;}
    .btn-search:hover{opacity:.85;}
    .btn-search:disabled{opacity:.4;cursor:not-allowed;}

    /* État : génération IA en cours */
    .ai-generating{grid-column:1/-1;background:var(--surface);border:1.5px solid rgba(139,92,246,.4);border-radius:var(--r);padding:32px 24px;text-align:center;}
    .ai-generating .ai-gen-icon{font-size:2.2rem;margin-bottom:12px;animation:pulse 1.4s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
    .ai-generating h3{font-family:var(--fh);font-weight:700;font-size:1rem;margin-bottom:6px;color:var(--text);}
    .ai-generating p{font-size:.83rem;color:var(--muted);margin-bottom:16px;line-height:1.55;}
    .ai-gen-steps{display:flex;flex-direction:column;gap:6px;max-width:320px;margin:0 auto;}
    .ai-gen-step{display:flex;align-items:center;gap:9px;font-size:.8rem;padding:6px 12px;border-radius:6px;color:var(--muted);}
    .ai-gen-step.active{color:#a78bfa;background:rgba(139,92,246,.1);}
    .ai-gen-step.done{color:#4ade80;background:rgba(74,222,128,.08);}
    .ai-gen-step .sico{font-size:.85rem;min-width:16px;}
    .ai-gen-bar{height:3px;background:var(--border);border-radius:2px;margin-top:14px;overflow:hidden;max-width:320px;margin-left:auto;margin-right:auto;}
    .ai-gen-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#3b82f6);border-radius:2px;width:0%;transition:width .7s ease;}

    /* État : hors domaine */
    .off-domain{grid-column:1/-1;background:var(--surface);border:1.5px solid rgba(245,158,11,.35);border-radius:var(--r);padding:32px 24px;text-align:center;}
    .off-domain .od-icon{font-size:2.2rem;margin-bottom:12px;}
    .off-domain h3{font-family:var(--fh);font-weight:700;font-size:1rem;margin-bottom:8px;color:var(--accent2);}
    .off-domain p{font-size:.85rem;color:var(--muted);line-height:1.6;max-width:460px;margin:0 auto 16px;}
    .od-suggestions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
    .od-sug{padding:5px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:.78rem;color:var(--muted);cursor:pointer;transition:all .2s;}
    .od-sug:hover{border-color:var(--accent);color:var(--accent);}

    /* Badge "Auto-généré" sur les cartes */
    .lc-ai-badge{position:absolute;top:10px;right:10px;background:rgba(139,92,246,.18);border:1px solid rgba(139,92,246,.4);color:#a78bfa;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.04em;text-transform:uppercase;}
    @media(max-width:960px){.sleft,.infobox,.rel-box{display:none;}}
    @media(max-width:640px){.wrap{padding:16px 12px 60px;}}
    /* Ajustement sticky sidebar : navbar ElectroInfo 68px */
    .sleft{top:78px;max-height:calc(100vh - 94px);}
    @media(max-width:768px){.sleft{top:70px;max-height:calc(100vh - 86px);}}

    /* ─── FEEDBACK ─── */
    .feedback-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);}
    .fb-label{font-size:.84rem;color:var(--muted);flex:1;min-width:140px;}
    .fb-btn{padding:7px 16px;border-radius:20px;font-size:.84rem;font-weight:600;border:1.5px solid var(--border);color:var(--text);background:var(--surface2);transition:all .2s;cursor:pointer;}
    .fb-btn.fb-yes:hover{background:#dcfce7;border-color:#16a34a;color:#16a34a;}
    .fb-btn.fb-no:hover{background:#fee2e2;border-color:#dc2626;color:#dc2626;}
    .fb-btn:disabled{cursor:default;}
    .fb-score{font-size:.78rem;color:var(--muted);}

    /* ─── IMPRESSION ─── */
    @media print{
      .navbar,.sleft,.back-btn,.art-share,.feedback-bar,.toast,.fntip,
      .toc-tog,.infobox,.rel-box{display:none!important;}
      body{background:#fff!important;color:#0d0f14!important;}
      .wrap,.main{padding:0!important;display:block!important;}
      .artview,.artbody{display:block!important;max-width:100%!important;}
      .art-h1{font-size:1.6rem;}
      .formula{background:#f8f9fa;border-left:3px solid #1e40af;padding:8px 14px;}
    }
    @keyframes fu{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  </style>
</head>

<!-- ══════════ FIREBASE SDK ══════════ -->
<script type="module">
  import { initializeApp }                from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy, setDoc, updateDoc, increment }
                                          from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ┌─────────────────────────────────────────┐
  // │  REMPLACE ICI avec ta config Firebase   │
  // └─────────────────────────────────────────┘
  const firebaseConfig = {
    apiKey:            "VOTRE_API_KEY",
    authDomain:        "VOTRE_PROJECT.firebaseapp.com",
    projectId:         "VOTRE_PROJECT_ID",
    storageBucket:     "VOTRE_PROJECT.appspot.com",
    messagingSenderId: "VOTRE_SENDER_ID",
    appId:             "VOTRE_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // ─── BASE URL dynamique ───────────────────
  const BASE_URL = window.location.origin + window.location.pathname;

  // ─── Données en mémoire ──────────────────
  let DB        = [];   // toutes les fiches
  let filterCat = 'all';
  let curArt    = null;

  // ══════════════════════════════════════════
  // CHARGEMENT FIRESTORE
  // ══════════════════════════════════════════
  async function loadArticles() {
    try {
      const snap = await getDocs(query(collection(db, 'encyclopedie'), orderBy('title')));
      if (snap.empty) {
        // Firestore vide → données de démo
        DB = DEMO_DATA;
        showToast('📖 Mode démo — ajoutez des fiches depuis l\'admin');
      } else {
        DB = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      }
    } catch (e) {
      console.warn('Firestore:', e.message);
      DB = DEMO_DATA;
      showToast('⚠️ Firebase non configuré — mode démo');
    }
    buildSidebar();
    renderList();
    // Vérifier si une fiche est demandée dans le hash
    const hash = window.location.hash.replace('#','');
    if (hash) openA(hash);
  }

  // ══════════════════════════════════════════
  // ROUTING HASH — chaque article a son URL
  // ══════════════════════════════════════════
  window.addEventListener('hashchange', () => {
    const h = window.location.hash.replace('#','');
    if (h) openA(h);
    else   backToList();
  });

  // ══════════════════════════════════════════
  // SIDEBAR
  // ══════════════════════════════════════════
  function buildSidebar(q='') {
    const ql = q.toLowerCase();
    const f  = DB.filter(a => !ql || a.title.toLowerCase().includes(ql) || a.summary.toLowerCase().includes(ql));
    const groups = {};
    f.forEach(a => {
      const l = a.title[0].toUpperCase();
      if (!groups[l]) groups[l] = [];
      groups[l].push(a);
    });
    const letters = Object.keys(groups).sort();
    document.getElementById('sideIdx').innerHTML = letters.map(l => `
      <div class="sl-letter">${l}</div>
      ${groups[l].map(a => `
        <div class="se${curArt?.id===a.id?' active':''}" onclick="openA('${a.id}')">
          <span class="se-icon">${a.icon||'📄'}</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.title}</span>
          <span class="cbadge ${a.tag}">${a.tag==='composant'?'CI':'Él.'}</span>
        </div>`).join('')}
    `).join('');
    document.getElementById('sl-count').textContent = `${f.length} fiche${f.length>1?'s':''}`;
  }
  window.filterSidebar = q => buildSidebar(q);

  // ══════════════════════════════════════════
  // LISTE
  // ══════════════════════════════════════════
  window.setFilter = (cat, btn) => {
    filterCat = cat;
    document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    renderList();
  };

  function renderList() {
    const d = filterCat==='all' ? DB : DB.filter(a => a.tag===filterCat);
    const grid = document.getElementById('lgrid');
    if (!d.length) {
      grid.innerHTML = `<div style="grid-column:1/-1"><div class="state-box"><div class="icon">🔍</div><p>Aucune fiche dans cette catégorie.</p></div></div>`;
      return;
    }
    grid.innerHTML = d.map((a,i) => `
      <div class="lc" onclick="openA('${a.id}')" style="animation-delay:${i*.04}s">
        <div class="lc-top">
          <span class="lc-icon">${a.icon||'📄'}</span>
          <span class="lctag ${a.tag}">${a.tag==='composant'?'Composant':'Électricité'}</span>
        </div>
        <h3>${a.title}</h3>
        <p>${a.summary}</p>
        <div class="lc-foot">
          <span class="lc-meta">📖 ${a.lecture||'—'} · ${a.niveau||'—'}</span>
          <span class="lc-arr">→</span>
        </div>
      </div>
    `).join('');
  }

  // ══════════════════════════════════════════
  // RECHERCHE INTELLIGENTE
  // ══════════════════════════════════════════

  // Mots-clés du domaine — utilisés pour détecter les recherches hors-domaine
  const DOMAIN_KEYWORDS = [
    'électr','electr','courant','tension','résistance','resistance','condensateur',
    'transistor','diode','inductance','bobine','transformateur','moteur','alternateur',
    'générateur','generateur','redresseur','onduleur','variateur','automate',
    'relais','contacteur','disjoncteur','fusible','interrupteur','câble','cable',
    'conducteur','isolant','puissance','énergie','energie','fréquence','frequence',
    'ampère','ampere','volt','watt','ohm','hertz','farad','henry','tesla',
    'circuit','schéma','schema','loi','norme','nf c','nf en','iec','ute',
    'basse tension','haute tension','courant alternatif','courant continu',
    'triphasé','triphasé','monophasé','triphasé','neutre','phase','terre',
    'sécurité','securite','protection','installation','bâtiment','batiment',
    'domotique','robotique','capteur','actuateur','microcontrôleur','arduino',
    'electronique','électronique','semi-conducteur','composant','signal','filtre',
    'amplificateur','oscillateur','régulateur','regulateur','convertisseur',
    'solaire','photovoltaïque','photovoltaique','batterie','accumulateur',
    'puissance','rendement','efficacité','thermique','chauffage','éclairage',
    'luminosité','led','lampe','panneau','tableau','armoire','câblage','cablage'
  ];

  function isInDomain(query) {
    const q = query.toLowerCase();
    return DOMAIN_KEYWORDS.some(kw => q.includes(kw));
  }

  // ── Full-text search sur titre, résumé, sections, infobox, refs ──
  function fullTextScore(a, q) {
    const tokens = q.toLowerCase().split(/\s+/).filter(t => t.length > 1);
    if (!tokens.length) return 0;

    // Construire le corpus texte de la fiche
    const titleStr   = (a.title   || '').toLowerCase();
    const idStr      = (a.id      || '').toLowerCase();
    const subStr     = (a.subtitle|| '').toLowerCase();
    const summaryStr = (a.summary || '').toLowerCase();
    const infoStr    = (a.infobox || []).map(r => `${r.k} ${r.v}`).join(' ').toLowerCase();
    const sectStr    = (a.sections|| []).map(s => {
      const subContent = (s.subs||[]).map(sub => `${sub.h3} ${sub.html||''}`).join(' ');
      return `${s.h2} ${s.html||''} ${subContent}`;
    }).join(' ').replace(/<[^>]+>/g,'').toLowerCase();
    const refsStr    = (a.refs    || []).join(' ').toLowerCase();

    let score = 0;
    for (const t of tokens) {
      // Titre = poids max
      if (titleStr === t || idStr === t || idStr === t.replace(/\s+/g,'-')) score += 100;
      else if (titleStr.startsWith(t)) score += 60;
      else if (titleStr.includes(t))   score += 40;
      // Sous-titre / résumé
      if (subStr.includes(t))          score += 20;
      if (summaryStr.includes(t))      score += 15;
      // Infobox
      if (infoStr.includes(t))         score += 10;
      // Sections (full-text)
      if (sectStr.includes(t))         score += 8;
      // Références
      if (refsStr.includes(t))         score += 3;
    }
    return score;
  }

  function findInDB(query) {
    const q = query.trim();
    if (!q) return null;
    const scored = DB.map(a => ({ a, s: fullTextScore(a, q) }))
                     .filter(x => x.s > 0)
                     .sort((x,y) => y.s - x.s);
    return scored.length ? scored[0].a : null;
  }

  // Afficher l'état "génération IA en cours" dans la grille
  function showGeneratingState(query) {
    const steps = [
      { label: 'Analyse de la requête', done: false },
      { label: 'Génération du contenu', done: false },
      { label: 'Structuration de la fiche', done: false },
      { label: 'Enregistrement dans Firestore', done: false },

  // Fonction principale de recherche intelligente
  window.smartSearch = async function(query) {
    if (!query) { renderList(); return; }

    const btn = document.getElementById('btnSearch');
    if (btn) btn.disabled = true;

    const q = query.trim();

    // 1. Chercher dans la base — score fort = ouvre directement
    const q_lower = q.toLowerCase();
    const scored = DB.map(a => ({ a, s: fullTextScore(a, q) }))
                     .filter(x => x.s > 0)
                     .sort((x,y) => y.s - x.s);

    if (scored.length && scored[0].s >= 40) {
      // Correspondance forte → ouvre directement
      if (btn) btn.disabled = false;
      openA(scored[0].a.id);
      return;
    }

    if (scored.length && scored[0].s > 0) {
      // Correspondance partielle → afficher suggestions
      if (btn) btn.disabled = false;
      const grid = document.getElementById('lgrid');
      grid.innerHTML = `
        <div style="grid-column:1/-1;margin-bottom:18px;">
          <div class="off-domain" style="border-color:rgba(59,130,246,.3);">
            <div class="od-icon">🔍</div>
            <h3 style="color:var(--accent);">Résultats proches pour "${q}"</h3>
            <p>Aucune fiche exacte, mais ces fiches pourraient correspondre :</p>
            <div class="od-suggestions">
              ${scored.slice(0,5).map(x=>`<span class="od-sug" onclick="openA('${x.a.id}')">${x.a.icon||'📄'} ${x.a.title}</span>`).join('')}
            </div>
            <p style="margin-top:12px;font-size:.78rem;">Ou <button class="btn" onclick="window._forceGenerate('${q.replace(/'/g,"\\'")}')">générer une nouvelle fiche IA</button> sur ce sujet</p>
          </div>
        </div>`;
      return;
    }

    // 2. Vérifier si la requête est dans le domaine
    if (!isInDomain(query)) {
      showOffDomain(query);
      if (btn) btn.disabled = false;
      return;
    }

    // 3. Génération IA
    await _generateAndSave(query, btn);
  };

      const res = await fetch('https://api.anthropic.com/v1/messages', {

  window.submitFeedback = async function(id, vote, btn) {
    const bar = document.getElementById(`feedback-${id}`);
    if (!bar || bar.dataset.voted) return;
    bar.dataset.voted = '1';
    bar.querySelectorAll('.fb-btn').forEach(b => { b.disabled = true; b.style.opacity = '.5'; });
    btn.style.opacity = '1';
    btn.style.transform = 'scale(1.15)';
    try {
      const ref = doc(db, 'encyclopedie', id);
      await updateDoc(ref, {
        feedbackUp:   increment(vote > 0  ? 1 : 0),
        feedbackDown: increment(vote < 0  ? 1 : 0),
      });
    } catch(e) { console.warn('feedback:', e.message); }
    const score = document.getElementById(`fbscore-${id}`);
    if (score) score.textContent = vote > 0 ? '👍 Merci !' : 'Merci pour votre retour.';
    localStorage.setItem(`fb_${id}`, vote);
  };

  async function loadFeedbackScore(id) {
    const local = localStorage.getItem(`fb_${id}`);
    const bar   = document.getElementById(`feedback-${id}`);
    if (!bar) return;
    if (local) {
      bar.dataset.voted = '1';
      bar.querySelectorAll('.fb-btn').forEach(b => { b.disabled = true; b.style.opacity = '.5'; });
      const score = document.getElementById(`fbscore-${id}`);
      if (score) score.textContent = local > 0 ? '👍 Déjà voté' : 'Déjà voté';
    }
    // Charger le score depuis Firestore
    try {
      const snap = await getDoc(doc(db, 'encyclopedie', id));
      if (snap.exists()) {
        const d = snap.data();
        const up = d.feedbackUp||0, dn = d.feedbackDown||0, tot = up+dn;
        const score = document.getElementById(`fbscore-${id}`);
        if (score && tot > 0 && !local) {
          score.textContent = `${up}/${tot} utile${tot>1?'s':''}`;
        }
      }
    } catch(e) {}
  }

  const DEMO_DATA = [
    {id:"resistance",icon:"🟫",tag:"composant",title:"Résistance",subtitle:"Composant passif limiteur de courant",summary:"Composant électronique passif qui s'oppose au passage du courant électrique, provoquant une chute de tension proportionnelle selon la loi d'Ohm.",lecture:"5 min",niveau:"Débutant",infobox:[{k:"Symbole NF EN 60617",v:"—R—",mono:true},{k:"Unité",v:"Ohm (Ω)"},{k:"Type",v:"Composant passif"},{k:"Loi associée",v:"Loi d'Ohm"},{k:"Code couleur",v:"4 ou 5 bandes"}],sections:[{h2:"Définition",id:"def",html:`<p class="art-p">Une <strong>résistance</strong> est un composant électronique passif qui oppose une résistance au passage du <span class="wl" onclick="openA('courant')">courant électrique</span>. Elle dissipe l'énergie sous forme de chaleur (effet Joule).<button class="rn" onclick="showRef(event,0)">1</button></p><p class="art-p">La valeur est exprimée en <strong>Ohms (Ω)</strong>. On trouve des résistances de quelques Ω à plusieurs MΩ.</p>`,subs:[]},{h2:"Loi d'Ohm",id:"loi",html:``,subs:[{h3:"Formule fondamentale",id:"formule",html:`<div class="formula">U = R × I</div><p class="art-p">La <span class="wl" onclick="openA('loi-ohm')">loi d'Ohm</span> relie la <span class="wl" onclick="openA('tension')">tension U</span>, la résistance R et le <span class="wl" onclick="openA('courant')">courant I</span>.</p>`},{h3:"Puissance dissipée",id:"pwr",html:`<div class="formula">P = R × I² = U² / R</div><p class="art-p">Chaque résistance a une puissance maximale admissible. Prévoir un facteur ×2 pour la fiabilité.<button class="rn" onclick="showRef(event,1)">2</button></p>`}]},{h2:"Code couleur",id:"couleur",html:`<p class="art-p">Les résistances portent <strong>4 ou 5 bandes colorées</strong>. Les premières bandes indiquent les chiffres, la suivante le multiplicateur, et la dernière la tolérance (or = ±5%, marron = ±1%).</p>`,subs:[]},{h2:"Associations",id:"assoc",html:``,subs:[{h3:"En série",id:"serie",html:`<div class="formula">R_total = R1 + R2 + R3 + …</div>`},{h3:"En parallèle",id:"para",html:`<div class="formula">1/R_total = 1/R1 + 1/R2 + …</div>`}]}],refs:["Georg Simon Ohm, Die galvanische Kette, Berlin, 1827.","IEC 60115-1:2020 — Résistances fixes pour équipements électroniques."],related:["condensateur","loi-ohm","tension"]},
    {id:"condensateur",icon:"🔷",tag:"composant",title:"Condensateur",subtitle:"Composant passif de stockage de charge",summary:"Composant passif capable de stocker de l'énergie sous forme de champ électrique, utilisé pour le filtrage, le découplage ou le stockage.",lecture:"6 min",niveau:"Débutant",infobox:[{k:"Symbole NF EN 60617",v:"—||—",mono:true},{k:"Unité",v:"Farad (F)"},{k:"Grandeur",v:"Capacité"},{k:"Polarisation",v:"Électrolytique ou non"}],sections:[{h2:"Définition",id:"def",html:`<p class="art-p">Deux armatures séparées par un diélectrique. La <span class="wl" onclick="openA('tension')">tension</span> appliquée crée un champ électrique stockant de l'énergie.<button class="rn" onclick="showRef(event,0)">1</button></p>`,subs:[]},{h2:"Relation fondamentale",id:"rel",html:`<div class="formula">Q = C × U</div>`,subs:[]},{h2:"Types",id:"types",html:``,subs:[{h3:"Céramique",id:"cera",html:`<p class="art-p">Non polarisé, hautes fréquences, découplage d'alimentation.</p>`},{h3:"Électrolytique",id:"elec-t",html:`<p class="art-p"><strong>Polarisé</strong> — ne jamais inverser (risque explosion). Grandes capacités.<button class="rn" onclick="showRef(event,1)">2</button></p>`},{h3:"Film polyester",id:"film",html:`<p class="art-p">Stable, faibles pertes, audio et filtres BF.</p>`}]}],refs:["Horowitz & Hill, The Art of Electronics, 3e éd., Cambridge UP, 2015.","IEC 60384-1:2021 — Condensateurs fixes."],related:["resistance","inductance","transistor"]},
    {id:"transistor",icon:"🔺",tag:"composant",title:"Transistor",subtitle:"Composant actif d'amplification et commutation",summary:"Composant semi-conducteur fondamental permettant d'amplifier un signal ou de commuter un circuit. Inventé en 1947, pilier de l'électronique moderne.",lecture:"8 min",niveau:"Intermédiaire",infobox:[{k:"Types courants",v:"NPN, PNP, MOSFET"},{k:"Type",v:"Composant actif"},{k:"Gain courant",v:"β (hFE)"}],sections:[{h2:"Historique",id:"hist",html:`<p class="art-p">Inventé en <strong>1947</strong> aux Bell Labs par Shockley, Bardeen et Brattain.<button class="rn" onclick="showRef(event,0)">1</button></p>`,subs:[]},{h2:"Transistor bipolaire BJT",id:"bjt",html:``,subs:[{h3:"Gain en courant",id:"gain",html:`<div class="formula">Ic = β × Ib</div><p class="art-p">β typiquement entre 100 et 500 pour un NPN standard.<button class="rn" onclick="showRef(event,1)">2</button></p>`}]},{h2:"Modes de fonctionnement",id:"modes",html:`<p class="art-p"><strong>Coupure</strong> (bloqué) · <strong>Saturation</strong> (passant) · <strong>Actif</strong> (amplification).</p>`,subs:[]}],refs:["Bardeen & Brattain, Physical Review, 74(2), 1948.","ON Semiconductor, BC547 Datasheet, Rev.7, 2014."],related:["diode","resistance","circuit-integre"]},
    {id:"diode",icon:"▶",tag:"composant",title:"Diode",subtitle:"Composant à conduction unidirectionnelle",summary:"Composant semi-conducteur ne laissant passer le courant que dans un seul sens. Redressement, protection et régulation de tension.",lecture:"5 min",niveau:"Débutant",infobox:[{k:"Symbole NF EN 60617",v:"→|—",mono:true},{k:"Tension de seuil",v:"~0,6–0,7 V (Si)"},{k:"Types",v:"Redresseur, Zener, LED, Schottky"}],sections:[{h2:"Principe",id:"principe",html:`<p class="art-p">Conduit en direct (anode > cathode), bloque en inverse.<button class="rn" onclick="showRef(event,0)">1</button></p>`,subs:[]},{h2:"Types",id:"types",html:``,subs:[{h3:"Zener",id:"zener",html:`<p class="art-p">Régule une <span class="wl" onclick="openA('tension')">tension</span> en inverse à Vz défini.</p>`},{h3:"LED",id:"led",html:`<p class="art-p">Émet de la lumière. Toujours avec une <span class="wl" onclick="openA('resistance')">résistance</span> de limitation.</p>`},{h3:"Schottky",id:"schottky",html:`<p class="art-p">Seuil ~0,3 V, commutation rapide. Alimentations découpage.</p>`}]}],refs:["Sze & Ng, Physics of Semiconductor Devices, 3e éd., Wiley, 2007."],related:["transistor","resistance","loi-ohm"]},
    {id:"inductance",icon:"🌀",tag:"composant",title:"Inductance (Bobine)",subtitle:"Composant passif de stockage magnétique",summary:"Stocke l'énergie sous forme de champ magnétique et résiste aux variations rapides du courant (loi de Lenz).",lecture:"5 min",niveau:"Débutant",infobox:[{k:"Symbole NF EN 60617",v:"—⌇⌇⌇—",mono:true},{k:"Unité",v:"Henry (H)"}],sections:[{h2:"Définition",id:"def",html:`<div class="formula">u = L × (di/dt)</div><p class="art-p">S'oppose aux variations de <span class="wl" onclick="openA('courant')">courant</span>. Bloque les hautes fréquences.<button class="rn" onclick="showRef(event,0)">1</button></p>`,subs:[]}],refs:["Griffiths, Introduction to Electrodynamics, 4e éd., Cambridge UP, 2017."],related:["condensateur","resistance","transistor"]},
    {id:"circuit-integre",icon:"💾",tag:"composant",title:"Circuit intégré",subtitle:"Assemblage miniaturisé de composants",summary:"Ensemble de composants électroniques gravés sur une puce de silicium. Cœur de l'électronique numérique et analogique moderne.",lecture:"7 min",niveau:"Intermédiaire",infobox:[{k:"Abréviation",v:"CI / IC"},{k:"Matériau",v:"Silicium (Si)"}],sections:[{h2:"Historique",id:"hist",html:`<p class="art-p">Inventé en 1958–1959 par Jack Kilby (TI) et Robert Noyce (Fairchild).<button class="rn" onclick="showRef(event,0)">1</button></p>`,subs:[]},{h2:"Types principaux",id:"types",html:`<p class="art-p">Portes logiques, amplificateurs opérationnels, microcontrôleurs, régulateurs de <span class="wl" onclick="openA('tension')">tension</span>, mémoires.</p>`,subs:[]}],refs:["Kilby, US Patent 3,138,743, 1959."],related:["transistor","diode","resistance"]},
    {id:"tension",icon:"⚡",tag:"electricite",title:"Tension électrique",subtitle:"Différence de potentiel entre deux points",summary:"La tension mesure le travail nécessaire pour déplacer une charge entre deux points d'un circuit. Unité : le volt (V).",lecture:"4 min",niveau:"Débutant",infobox:[{k:"Symbole",v:"U ou V"},{k:"Unité",v:"Volt (V)"},{k:"Mesure",v:"Voltmètre (//)"},{k:"Réseau France",v:"230 V / 50 Hz"}],sections:[{h2:"Définition",id:"def",html:`<p class="art-p">Différence de potentiel électrique entre deux points.<button class="rn" onclick="showRef(event,0)">1</button></p>`,subs:[]},{h2:"DC vs AC",id:"acdc",html:``,subs:[{h3:"Continu (DC)",id:"dc",html:`<p class="art-p">Valeur fixe (batterie 12 V). Électronique embarquée.</p>`},{h3:"Alternatif (AC)",id:"ac",html:`<div class="formula">V_eff = V_max / √2 ≈ 0,707 × V_max</div><p class="art-p">Réseau EDF : 230 V efficaces à 50 Hz.</p>`}]},{h2:"Mesure",id:"mesure",html:`<p class="art-p">Voltmètre branché <em>en parallèle</em>.<button class="rn" onclick="showRef(event,1)">2</button></p>`,subs:[]}],refs:["Griffiths, Introduction to Electrodynamics, Cambridge UP, 2017.","NF EN 61010-1 — Sécurité appareils de mesure."],related:["courant","puissance","loi-ohm"]},
    {id:"courant",icon:"➡️",tag:"electricite",title:"Courant électrique",subtitle:"Déplacement ordonné de charges électriques",summary:"Flux de porteurs de charges à travers un conducteur. Unité : l'ampère (A). Grandeur fondamentale de l'électricité.",lecture:"4 min",niveau:"Débutant",infobox:[{k:"Symbole",v:"I"},{k:"Unité",v:"Ampère (A)"},{k:"Mesure",v:"Ampèremètre (série)"}],sections:[{h2:"Définition",id:"def",html:`<div class="formula">I = Q / t</div><p class="art-p">I (A) = Q (coulombs) / t (secondes).<button class="rn" onclick="showRef(event,0)">1</button></p>`,subs:[]},{h2:"Courant et sécurité",id:"secu",html:`<p class="art-p">→ <strong>1 mA</strong> perception · <strong>10 mA</strong> tétanisation · <strong>30 mA</strong> fibrillation · <strong>100 mA</strong> arrêt cardiaque. Norme <span class="wl" onclick="openA('nf-c-15-100')">NF C 15-100</span>.<button class="rn" onclick="showRef(event,1)">2</button></p>`,subs:[]}],refs:["Feynman, Lectures on Physics Vol.2, Addison-Wesley, 1964.","NF C 15-100:2002+A3:2015, §131."],related:["tension","puissance","protection-diff"]},
    {id:"puissance",icon:"🔋",tag:"electricite",title:"Puissance électrique",subtitle:"Énergie consommée par unité de temps",summary:"Mesure la quantité d'énergie électrique transférée par unité de temps. Unité : le watt (W).",lecture:"5 min",niveau:"Débutant",infobox:[{k:"Symbole",v:"P"},{k:"Unité",v:"Watt (W)"},{k:"Formule DC",v:"P = U × I"}],sections:[{h2:"En courant continu",id:"dc",html:`<div class="formula">P = U × I = R × I²</div>`,subs:[]},{h2:"En courant alternatif",id:"ac",html:`<div class="formula">P = U × I × cos(φ)</div><p class="art-p">cos(φ) = facteur de puissance (1 pour charge résistive).<button class="rn" onclick="showRef(event,0)">1</button></p>`,subs:[]}],refs:["NF EN 61000-3-2:2019 — Harmoniques de courant."],related:["tension","courant","loi-ohm"]},
    {id:"loi-ohm",icon:"📐",tag:"electricite",title:"Loi d'Ohm",subtitle:"Relation fondamentale entre U, I et R",summary:"La loi de base de l'électricité : la tension aux bornes d'un conducteur ohmique est proportionnelle au courant qui le traverse.",lecture:"4 min",niveau:"Débutant",infobox:[{k:"Formule",v:"U = R × I",mono:true},{k:"Énoncé par",v:"Georg Ohm (1827)"},{k:"Limite",v:"Non-linéaire : diodes, transistors"}],sections:[{h2:"Énoncé",id:"enonce",html:`<div class="formula">U = R×I &nbsp;·&nbsp; I = U/R &nbsp;·&nbsp; R = U/I</div><p class="art-p">Valable pour les composants <em>linéaires</em> seulement.<button class="rn" onclick="showRef(event,0)">1</button></p>`,subs:[]},{h2:"Limites",id:"limites",html:`<p class="art-p">Les <span class="wl" onclick="openA('diode')">diodes</span> et <span class="wl" onclick="openA('transistor')">transistors</span> ont un comportement non-linéaire.</p>`,subs:[]}],refs:["Ohm, G.S., Die galvanische Kette, Berlin, 1827."],related:["resistance","tension","courant"]},
    {id:"protection-diff",icon:"🛡️",tag:"electricite",title:"Disjoncteur différentiel",subtitle:"Protection contre les défauts d'isolement",summary:"Coupe le circuit en cas de fuite de courant vers la terre. Indispensable pour la sécurité des personnes selon la NF C 15-100.",lecture:"6 min",niveau:"Intermédiaire",infobox:[{k:"Norme",v:"NF C 15-100"},{k:"Seuil standard",v:"30 mA"},{k:"Temps de coupure",v:"< 40 ms"}],sections:[{h2:"Principe",id:"principe",html:`<p class="art-p">Compare les <span class="wl" onclick="openA('courant')">courants</span> phase et neutre. Toute différence = fuite → coupure.<button class="rn" onclick="showRef(event,0)">1</button></p>`,subs:[]},{h2:"Classes",id:"classes",html:`<p class="art-p"><strong>AC</strong> : sinusoïdal · <strong>A</strong> : pulsé (lave-linge) · <strong>B</strong> : continu (solaire, VE). Type A minimum obligatoire en logement neuf.</p>`,subs:[]}],refs:["NF C 15-100:2002+A3:2015, §413."],related:["courant","nf-c-15-100","tension"]},

<!-- ===== NAVBAR : HAMBURGER + LANG SWITCHER ===== -->
<script>
(function() {
  // ── Hamburger mobile ──
  const toggle = document.getElementById('mobileToggle');
  const menu   = document.getElementById('mobileMenu');
  if (toggle && menu) {
    toggle.addEventListener('click', function() {
      const open = menu.classList.toggle('active');
      toggle.setAttribute('aria-expanded', open);
      toggle.querySelector('i').className = open ? 'fas fa-times' : 'fas fa-bars';
    });
    // Fermer en cliquant sur un lien
    menu.querySelectorAll('.nav-link').forEach(l => {
      l.addEventListener('click', function() {
        menu.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.querySelector('i').className = 'fas fa-bars';
      });
    });
  }

  // ── Sélecteur de langue ──
  const T = {
    fr: { nav_home:'Accueil', nav_articles:'Articles', nav_encyclopedia:'Encyclopédie', nav_courses:'Cours', nav_about:'À propos', nav_contact:'Contact', nav_login:'Connexion', nav_logout:'Déconnexion', nav_profile:'Mon profil', nav_admin:'Administration' },
    en: { nav_home:'Home', nav_articles:'Articles', nav_encyclopedia:'Encyclopedia', nav_courses:'Courses', nav_about:'About', nav_contact:'Contact', nav_login:'Login', nav_logout:'Logout', nav_profile:'My Profile', nav_admin:'Administration' },
    ewe: { nav_home:'Ŋɔliƒe', nav_articles:'Nuŋlɔɖiwo', nav_encyclopedia:'Nusrɔsrɔ', nav_courses:'Nunya Ɖeɖewo', nav_about:'Míaƒe Ŋutinyenye', nav_contact:'Ɖoɖo', nav_login:'Yi ŋu', nav_logout:'Tso ŋu', nav_profile:'Míaƒe Ame Ŋutinyenye', nav_admin:'Dɔwɔƒe Ŋutiŋuti' }
  };
  const LABELS = { ewe:'🌍 Eʋe', fr:'🇫🇷 FR', en:'🇬🇧 EN' };
  const KEY = 'electroinfo_lang';

  window.setLang = function(lang) {
    localStorage.setItem(KEY, lang);
    const d = T[lang]; if (!d) return;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      if (d[k] !== undefined) el.textContent = d[k];
    });
    const btn = document.getElementById('langCurrentBtn');
    if (btn) btn.textContent = LABELS[lang];
    document.querySelectorAll('.lang-option').forEach(o => {
      o.classList.toggle('lang-active', o.dataset.lang === lang);
    });
    document.documentElement.lang = lang === 'ewe' ? 'ee' : lang;
    const dd = document.getElementById('langDropdown');
    if (dd) dd.classList.remove('open');
  };

  window.toggleLangDropdown = function() {
    const dd = document.getElementById('langDropdown');
    if (dd) dd.classList.toggle('open');
  };

  document.addEventListener('click', function(e) {
    if (!e.target.closest('#langSwitcher')) {
      const dd = document.getElementById('langDropdown');
      if (dd) dd.classList.remove('open');
    }
    // Fermer le user dropdown si clic dehors
    if (!e.target.closest('#userMenu')) {
      const ud = document.getElementById('userDropdown');
      if (ud) ud.classList.add('hidden');
    }
  });

  // ── User menu toggle ──
  const umt = document.getElementById('userMenuToggle');
  const udd = document.getElementById('userDropdown');
  if (umt && udd) {
    umt.addEventListener('click', function(e) {
      e.stopPropagation();
      udd.classList.toggle('hidden');
    });
  }

  // ── Appliquer la langue sauvegardée ──
  document.addEventListener('DOMContentLoaded', function() {
    const saved = localStorage.getItem(KEY) || 'fr';
    setLang(saved);
  });
})();
</script>
