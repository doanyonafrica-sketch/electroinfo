<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ElectroInfo — Redirection</title>
</head>
<body>
<script>
    // 404.html — GitHub Pages Router
    // Intercepte toutes les URLs propres et redirige vers la bonne page .html
    // tout en sauvegardant le path original dans sessionStorage pour que
    // le script JS cible puisse le relire.

    (function () {
        var path = window.location.pathname;
        var search = window.location.search || '';

        // Sauvegarde le path complet (avec query string si présent)
        sessionStorage.setItem('redirect_path', path + search);

        var parts = path.split('/').filter(Boolean);
        var segment = parts[0] || '';

        var dest;

        if (segment === 'course') {
            // /course/mon-slug → course-detail.html
            dest = '/course-detail.html';
        } else if (segment === 'matiere') {
            // /matiere/{courseId}/{matiereId} → matiere-detail.html  ← NOUVEAU
            dest = '/matiere-detail.html';
        } else if (segment === 'seance') {
            // /seance/mon-slug/seq-N/seance-N → session-detail.html  ← LE FIX
            dest = '/session-detail.html';
        } else if (segment === 'article') {
            // /article/mon-slug → article-detail.html
            dest = '/article-detail.html';
        } else {
            // Fallback : retour à l'accueil
            dest = '/';
        }

        window.location.replace(dest);
    })();
</script>
<noscript>
    <p>Redirection en cours… <a href="/">Retour à l'accueil</a></p>
</noscript>
</body>
</html>
