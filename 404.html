<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        // Technique SPA redirect pour GitHub Pages
        // Sauvegarde l'URL demandée et redirige vers la bonne page (sans .html)
        const path = window.location.pathname;
        const search = window.location.search;
        
        // Détecte la page cible selon le path
        let target = '/';
        
        if (path.startsWith('/course/')) {
            sessionStorage.setItem('redirect_path', path);
            target = '/course-detail';
        } else if (path.startsWith('/seance/')) {
            sessionStorage.setItem('redirect_path', path);
            target = '/session-detail';
        } else if (path.startsWith('/article/')) {
            sessionStorage.setItem('redirect_path', path);
            target = '/article-detail';
        } else if (path.startsWith('/session-detail')) {
            target = '/session-detail' + search;
        } else {
            // Autres pages propres (/about, /courses, etc.)
            const page = path.replace(/^\//, '') || 'index';
            target = '/' + page;
        }
        
        window.location.replace(target);
    </script>
    <title>Redirection...</title>
</head>
<body></body>
</html>
