<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        // Technique SPA redirect pour GitHub Pages
        // Sauvegarde l'URL demandée et redirige vers index.html
        const path = window.location.pathname;
        const search = window.location.search;
        
        // Détecte la page cible selon le path
        let target = '/';
        
        if (path.startsWith('/course/')) {
            target = '/course-detail.html' + search + (search ? '&' : '?') + '_path=' + encodeURIComponent(path);
            // Ou mieux : passe le slug via sessionStorage
            sessionStorage.setItem('redirect_path', path);
            target = '/course-detail.html';
        } else if (path.startsWith('/article/')) {
            sessionStorage.setItem('redirect_path', path);
            target = '/article-detail.html';
        } else if (path.startsWith('/session-detail')) {
            target = '/session-detail.html' + search;
        } else {
            // Autres pages propres (/about, /courses, etc.)
            const page = path.replace(/^\//, '') || 'index';
            target = '/' + page + '.html';
        }
        
        window.location.replace(target);
    </script>
    <title>Redirection...</title>
</head>
<body></body>
</html>
